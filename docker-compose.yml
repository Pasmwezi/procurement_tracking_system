services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password must be set}
      POSTGRES_DB: file_tracking
      TZ: America/Halifax
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tracker -d file_tracking" ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  app:
    image: amipabu/procurement_tracking_system@${APP_IMAGE_DIGEST:?APP_IMAGE_DIGEST must be set to a sha256 digest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "3006:3000"
    environment:
      DATABASE_URL: postgres://tracker:${DB_PASSWORD:?Database password must be set}@db:5432/file_tracking
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      NODE_ENV: production
      TZ: America/Halifax
      SERVER_HTTPS: "true"
      SERVER_HOST: track.consulat.ca
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health')
          .then(response => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
